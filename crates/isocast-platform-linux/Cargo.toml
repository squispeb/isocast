[package]
name = "isocast-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Linux back end for Isocast: capture, encode and file writing behind the engine's Platform trait."

[dependencies]
isocast-diagnostics = { path = "../isocast-diagnostics" }
anyhow = "1.0.104"
isocast-engine = { path = "../isocast-engine" }
isocast-protocol = { path = "../isocast-protocol" }
# The shared monitor surfaces: `Surface`, and the hand-over the daemon's
# clients fetch through (L.4).
isocast-surfaces = { path = "../isocast-surfaces", features = ["wgpu"] }
# Device enumeration, ffprobe output and the secrets file all parse
# JSON that the protocol's own dependency provides.
serde_json = "1.0.154"
# The engine's wgpu, pinned the same (its frame import is built on
# wgpu-hal). Minimal features here; the Linux target's entry below
# adds Vulkan, and no apple target ever resolves this crate's deps.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
# JPEG encoding for live monitors (the engine already depends on this
# crate; matching versions keeps one copy in the graph).
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The desktop's portals over the session bus: the screen-capture picker and
# the PipeWire node it hands back (L.2). zbus's blocking API needs no async
# runtime here; its version is the one the workspace already carries.
zbus = { version = "5.19.0", features = ["blocking"] }
# The screen node the portal's ScreenCast creates: this process is the
# stream's client, so capture is a copy, not another encoder process.
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
# The Linux target gets the Vulkan back end; the macOS feature set in
# the plain dependency entry above resolves for the apple targets only.
wgpu = { version = "=30.0.1", default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
] }
# The live encoders (L.5): H.264 through NVENC and AAC-LC in the
# system's shared libavcodec (FFmpeg n9), linked in-process (dynamic link keeps
# libav's LGPL fine) so `receive` can hand every frame out the moment
# it is done, which a pipe cannot honour.
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat", "swresample", "swscale"] }
# Browser sources (L.6): a web page rendered by WebKitGTK offscreen
# (the page's WebKit lives on one dedicated GTK main-loop thread). The
# `v2_40` feature matches the installed libwebkit2gtk-4.1 (GTK3,
# libsoup3; up-to-date version on this distro). Its crate's generation
# is the gtk-rs 0.18 one, so the `gtk` dependency matches webkit2gtk's
# own.
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
gtk = "0.18"
# gdk and cairo for WebKit's answers' types (its snapshot is a cairo
# surface, and the background color speaks gdk RGBA).
gdk = "0.18"
cairo-rs = "0.18"
# Page audio (L.6b): `audio.js` posts base64 strings through WebKit's
# script-message handler, whose value is a JavaScriptCore one (webkit2gtk
# links this crate without re-exporting it; same version as its own).
base64 = "0.22.1"
java_script_core = { package = "javascriptcore-rs", version = "=1.1" }
# The layouts (DRM modifiers) the GPU can import a DMA-BUF in, asked of
# Vulkan for the screen stream's format: the same ash wgpu-hal is built on
# (no new crate is compiled).
ash = "0.38.0"
# Window and app capture (L.2b): a plain Wayland client of the compositor's
# standard ext-foreign-toplevel-list and ext-image-copy-capture protocols.
# Both crates are already in the lock through winit's toolkit; the staging
# feature carries the ext-* protocol XMLs.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
